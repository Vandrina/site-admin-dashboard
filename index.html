<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <h1 class="dashboard-title">Site Admin Dashboard</h1>
    </div>
    <div class="header-right">
      <button class="header-btn btn" id="alertLogBtn">
        <span class="alert-badge" id="alertCount">0</span>
        Alerts
      </button>
      <button class="header-btn btn icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
      <div class="user-badge">Jesse</div>
    </div>
  </header>

  <!-- Alert Banner (below header) -->
  <div class="alert-banner" id="alertBanner">
    <div class="alert-content">
      <span class="alert-text" id="alertText"></span>
      <div class="alert-actions">
        <button class="alert-btn btn" id="alertAddTask">Add to Tasks</button>
        <button class="alert-btn btn" id="alertResolve">Resolve</button>
        <button class="alert-btn-clear btn-secondary" id="alertDismiss">Clear</button>
      </div>
    </div>
  </div>

  <div class="dashboard-container">
    
    <!-- Task Sidebar -->
    <aside class="task-sidebar card">
      <div class="task-sidebar-header">
        <h2 class="sidebar-title section-title">TASKS</h2>
        <button class="icon-btn" id="taskFilterBtn" aria-label="Filter tasks">⌕</button>
      </div>

      <div class="task-filters" id="taskFilters" style="display: none;">
        <input type="text" class="task-search" placeholder="Search tasks..." id="taskSearch" aria-label="Search tasks">
        <div class="filter-group">
          <label class="filter-label">
            <input type="checkbox" checked id="filterAllSites"> All Sites
          </label>
          <label class="filter-label">
            <input type="checkbox" id="filterWilliam"> William
          </label>
          <label class="filter-label">
            <input type="checkbox" id="filterYourSite"> Your Site
          </label>
          <label class="filter-label">
            <input type="checkbox" id="filterOverdue"> Overdue
          </label>
        </div>
      </div>

      <div class="task-list" id="taskList">
        <!-- Tasks populated by JS -->
      </div>

      <div class="task-sidebar-footer">
        <button class="btn btn-add" id="addTaskBtn">+ New Task</button>
        <div class="sidebar-actions">
          <button class="icon-btn" id="exportTasksBtn" title="Export to text" aria-label="Export tasks">↓</button>
          <button class="icon-btn" id="taskSettingsBtn" title="Settings" aria-label="Task settings">⚙</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      
      <!-- Sites Grid -->
      <div class="sites-grid" id="sitesGrid">
        <!-- Site cards populated by JS -->
      </div>

      <button class="btn btn-add-site" id="addSiteBtn">+ Add New Site</button>

    </main>

  </div>

  <!-- Alert Log Modal -->
  <div class="modal" id="alertLogModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Alert Log</h2>
        <button class="modal-close" id="closeAlertLog" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="alert-log-list" id="alertLogList">
          <!-- Alert log items -->
        </div>
      </div>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="taskModalTitle">Task Details</h2>
        <button class="modal-close" id="closeTaskModal" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <div class="form-group">
            <label>Task Name</label>
            <input type="text" id="taskName" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="taskCategory" placeholder="e.g., ## William">
            </div>
            <div class="form-group">
              <label>Site</label>
              <select id="taskSite">
                <option value="">All Sites</option>
                <option value="william">William's Portfolio</option>
                <option value="yoursite">Your Site</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Due Date</label>
              <input type="date" id="taskDueDate">
            </div>
            <div class="form-group">
              <label>Reminder</label>
              <select id="taskReminder">
                <option value="">None</option>
                <option value="7">7 days</option>
                <option value="10">10 days</option>
                <option value="30">30 days</option>
                <option value="60">60 days (recurring)</option>
                <option value="90">90 days (recurring)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Dependencies</label>
            <input type="text" id="taskDependencies" placeholder="Blocked by...">
          </div>

          <div class="form-group">
            <label>Notes</label>
            <textarea id="taskNotes" rows="4"></textarea>
          </div>

          <div class="form-group">
            <label>Subtasks</label>
            <div id="subtasksList">
              <!-- Subtasks -->
            </div>
            <button type="button" class="btn-link" id="addSubtaskBtn">+ Add Subtask</button>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="deleteTaskBtn">Delete</button>
            <button type="submit" class="btn btn-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="tasks.js"></script>
  <script src="alerts.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
